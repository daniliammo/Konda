# Манифест стандартной библиотеки Konda — собирается системой сборки конды
# (`konda build`), а не прямым вызовом транспилятора из Makefile.
#
# Все модули (файл — I/O, строки — текст, хеш — FNV, поток — буферизованный
# вывод) остаются РАЗДЕЛЬНЫМИ исходниками (логическое деление для разработки),
# но транспилятор (§18) сливает их в ОДИН монолитный артефакт (§80):
# «имя = "libkonda_std"» → --имя → вывод/libkonda_std.{c,h,so,и}. Монолит даёт
# один -rpath, меньше стартовых релокаций, инлайн между модулями и одну точку
# авто-подключения (§35: сканер *.и найдёт единственный модуль «libkonda_std»).
#
# Сборка: cd stdlib && KONDA_TRANSPILER=<путь> <сборка.elf>
# (в Makefile это делает цель «stdlib»; фронтенд сам собирается из сборка/).

[проект]
имя       = "libkonda_std"
версия    = 0.5.0
тип       = "библиотека"

[сборка]
режим = "релиз"          # stdlib собирается в релизе (§82): guard'ы арифметики
                         # сняты, проверки границ срезов остаются (инвариант №1).
