# Эталонный манифест для init ОС «Чёрное Море» (Программы/Инициализация).
# init ПЕРЕВЕДЁН на konda build: его Makefile зовёт фронтенд с этим манифестом
# (реальный файл — Программы/Инициализация/Konda.toml). Соответствует прежнему
# прямому вызову транспилятора:
#     ТранспиляторКонда --аллокатор=libc --без-стандартной-библиотеки основа.конда
#
# Запуск:
#     cd Программы/Инициализация && KONDA_TRANSPILER=<путь> konda-build

[проект]
имя = "init"
# Источники не перечисляем: konda build сам находит основа.конда авто-сканом
# (поле «исходники» больше не поддерживается).

[сборка]
аллокатор = "libc"          # init тянул бы libjemalloc.so.2, а в rootfs его нет
стдлиб    = нет             # → --без-стандартной-библиотеки
