# Эталонный манифест для init ОС «Чёрное Море» (Программы/Инициализация).
# Показывает, как текущий вызов Makefile'а init'а
#     ТранспиляторКонда --аллокатор=libc --без-стандартной-библиотеки основа.конда
# выражается манифестом konda build. ССЫЛОЧНЫЙ пример: init пока собирается
# оркестратором ОС (Сборка/основа.c) напрямую; переключение его на konda build —
# архитектурное решение (требует согласия), см. docs/СИСТЕМА_СБОРКИ.md.
#
# Запуск (когда/если переключим):
#     cd Программы/Инициализация && KONDA_TRANSPILER=<путь> konda-build

[проект]
имя       = "init"
исходники = ["основа.конда"]

[сборка]
аллокатор = "libc"          # init тянул бы libjemalloc.so.2, а в rootfs его нет
стдлиб    = нет             # → --без-стандартной-библиотеки
