name: GCC 15 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Install GCC 15
      uses: aminya/setup-cpp@v1
      with:
        compiler: gcc-15

    - name: Checkout
      uses: actions/checkout@v4

    - name: install libjemalloc2
      run: sudo apt install libjemalloc2

    - name: make
      run: make

    - name: tests
      run: ./tests/run.sh
